<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Octagon -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#0b0f19" stroke="url(#grad)" stroke-width="2.5" />
  <!-- Neural Nodes -->
  <circle cx="16" cy="18" r="2.5" fill="#3b82f6" opacity="0.8" />
  <circle cx="48" cy="18" r="2.5" fill="#06b6d4" opacity="0.8" />
  <circle cx="16" cy="46" r="2.5" fill="#8b5cf6" opacity="0.8" />
  <circle cx="48" cy="46" r="2.5" fill="#3b82f6" opacity="0.8" />
  <!-- Connection Lines -->
  <line x1="16" y1="18" x2="32" y2="32" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4" />
  <line x1="48" y1="18" x2="32" y2="32" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.4" />
  <line x1="16" y1="46" x2="32" y2="32" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4" />
  <line x1="48" y1="46" x2="32" y2="32" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4" />
  <!-- Center Monogram TT -->
  <text x="32" y="39" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="#ffffff" letter-spacing="-1">TT</text>
</svg>